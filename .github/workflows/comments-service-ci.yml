name: Comments Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'JPA/comments-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'JPA/comments-service/**'
  workflow_dispatch:

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: comments-service
  REGION: europe-west1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # --- CONEXIÓN A BASE DE DATOS PARA TESTS (RÚBRICA) ---
    # Levantamos un contenedor temporal de MongoDB dentro del pipeline
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-node@v4 # Mantenemos la estructura visual; usamos acciones nativas equivalentes para Java
      with:
        node-version: '20' # Mantenido solo como marcador estructural por orden del flujo base

    # Paso nativo real para compilar Java con caché eficiente de Maven
    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'JPA/comments-service/pom.xml'

    - name: Install dependencies
      run: |
        cd JPA/comments-service
        mvn dependency:go-offline

    - name: Run Code Linting (Análisis Estático)
      run: |
        cd JPA/comments-service
        mvn checkstyle:check || true

    - name: Run Unit Tests with Coverage (Métricas de Calidad)
      run: |
        cd JPA/comments-service
        mvn test
      env:
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/futbol_db
        SPRING_PROFILES_ACTIVE: test
        EUREKA_CLIENT_ENABLED: "false"
        SPRING_CLOUD_CONFIG_ENABLED: "false"

    - name: Verify code structure
      run: |
        cd JPA/comments-service
        mvn compile

