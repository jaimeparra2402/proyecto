<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/landing"></ion-back-button>
    </ion-buttons>
    <ion-title>Buscador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="ion-no-margin ion-margin-bottom">
    <ion-card-content>
      <ion-searchbar 
        placeholder="Buscar por nombre..." 
        [(ngModel)]="searchName" 
        (ionInput)="loadPlayers()">
      </ion-searchbar>
      
      <ion-searchbar 
        placeholder="Buscar por Equipo/Liga..." 
        [(ngModel)]="searchTeam" 
        (ionInput)="loadPlayers()">
      </ion-searchbar>
    </ion-card-content>
  </ion-card>

  <ion-list lines="inset">
    <ion-item *ngFor="let player of players">
      <ion-avatar slot="start">
        <img [src]="player.image || 'assets/placeholder-player.png'" alt="Jugador" />
      </ion-avatar>
      <ion-label>
        <h2>{{ player.name }}</h2>
        <p>{{ player.team }} - {{ player.league }}</p>
      </ion-label>
    </ion-item>
    <p *ngIf="players.length === 0 && (searchName || searchTeam)" class="ion-margin-start">
      No se han encontrado resultados.
    </p>
  </ion-list>
</ion-content>
