<app-header
  title="Panel de Gestión"
  [showBackButton]="false">
</app-header>

<ion-content>
  <div class="home-container">

    <div class="menu-list">

      <button class="menu-item" (click)="goToPlayerList()">
        <div class="menu-left">
          <div class="menu-icon teal">▤</div>
          <div class="menu-text">
            <span class="menu-title">Ver jugadores</span>
            <span class="menu-desc">Listado completo con filtros</span>
          </div>
        </div>
        <span class="menu-arrow">›</span>
      </button>

      <button class="menu-item" (click)="goToAddPlayerForm()">
        <div class="menu-left">
          <div class="menu-icon blue">+</div>
          <div class="menu-text">
            <span class="menu-title">Añadir jugador</span>
            <span class="menu-desc">Crear desde formulario</span>
          </div>
        </div>
        <span class="menu-arrow">›</span>
      </button>

      <button class="menu-item" (click)="goToSearchPlayers()">
        <div class="menu-left">
          <div class="menu-icon orange">⤓</div>
          <div class="menu-text">
            <span class="menu-title">Importar desde API</span>
            <span class="menu-desc">Buscar en API Football</span>
          </div>
        </div>
        <span class="menu-arrow">›</span>
      </button>

      <button class="menu-item highlight" (click)="goToIdealTeam()">
        <div class="menu-left">
          <div class="menu-icon purple">✦</div>
          <div class="menu-text">
            <span class="menu-title">Equipo ideal IA</span>
            <span class="menu-desc">Generado con Gemini</span>
          </div>
        </div>
        <span class="menu-badge">IA</span>
      </button>

    </div>

    <div class="admin-section" *ngIf="authService.isSystemAdmin()">
      <p class="section-label">Administración</p>
      <button class="menu-item danger" (click)="goToViewNews()">
        <div class="menu-left">
          <div class="menu-icon red">📡</div>
          <div class="menu-text">
            <span class="menu-title">Publicar Noticia CORBA</span>
            <span class="menu-desc">Solo administradores</span>
          </div>
        </div>
        <span class="menu-arrow">›</span>
      </button>
    </div>

  </div>
</ion-content>
