<app-header title="Noticias" defaultHref="/landing"> </app-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Nueva noticia</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label>Jugador</ion-label>
        <ion-select [(ngModel)]="form.idJugador">
          <ion-select-option *ngFor="let p of players" [value]="p.id">
            {{ p.name || p.nombre }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Título</ion-label>
        <ion-input [(ngModel)]="form.titulo"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Noticia</ion-label>
        <ion-textarea [(ngModel)]="form.cuerpo"></ion-textarea>
      </ion-item>

      <ion-button expand="block" (click)="createNews()">
        Crear noticia
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
