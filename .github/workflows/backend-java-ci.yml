name: Backend Java CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'JPA/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'JPA/backend-java/**'
  workflow_dispatch:

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: backend-java
  REGION: europe-west1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # --- CONEXIÓN A BASE DE DATOS PARA TESTS (RÚBRICA) ---
    # Levantamos un contenedor temporal de MongoDB dentro del pipeline
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'JPA/backend-java/pom.xml'

    - name: Install dependencies
      run: |
        cd JPA/backend-java
        mvn dependency:go-offline

    - name: Run Code Linting (Análisis Estático)
      run: |
        cd JPA/backend-java
        mvn checkstyle:check || true

    - name: Run Unit Tests with Coverage (Métricas de Calidad)
      run: |
        cd JPA/backend-java
        mvn test
      env:
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/futbol_db
        SPRING_PROFILES_ACTIVE: test
        EUREKA_CLIENT_ENABLED: "false"
        SPRING_CLOUD_CONFIG_ENABLED: "false"
        API_FOOTBALL_KEY: 4f63c05c501e3759ae6fd3a9bcda27ea
        SPRING_AI_GOOGLE_AI_API_KEY: AIzaSyFakeGeminiKeyForGitHubActionsTest

    - name: Verify code structure
      run: |
        cd JPA/backend-java
        mvn compile

 deploy-to-gcp:
   needs: build-and-test
   if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
   runs-on: ubuntu-latest
   permissions:
     contents: read
     id-token: write
   steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Google Auth
     uses: google-github-actions/auth@v2
     with:
       credentials_json: ${{ secrets.GCP_SA_KEY }}

   - name: Set up Cloud SDK
     uses: google-github-actions/setup-gcloud@v2

   - name: Configure Docker for Artifact Registry
     run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

   - name: Build and Push Docker Image to Artifact Registry
     run: |
       cd JPA/backend-java
       docker build -t europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA .
       docker push europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA

   - name: Deploy to Cloud Run
     run: |
       gcloud run deploy $SERVICE_NAME \
         --image europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA \
         --platform managed \
         --region europe-west1 \
         --port 8081 \
         --set-env-vars SPRING_DATA_MONGODB_URI="mongodb+srv://admin:admin@cluster0.kvkm1vk.mongodb.net/futbol_db?appName=Cluster0",SPRING_PROFILES_ACTIVE="production",API_FOOTBALL_KEY="4f63c05c501e3759ae6fd3a9bcda27ea",SPRING_AI_GOOGLE_AI_API_KEY="AIzaSyCykidHMQE5teRSiykyrS-kxuFZf9YjvmE" \
         --timeout 300