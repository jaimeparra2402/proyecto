services:

  config-server:
    build: ./JPA/config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./JPA/eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10

  corba:
    build: ./JPA/corba
    depends_on:
      eureka-server:
        condition: service_healthy

  backend-java:
    build: ./JPA/backend-java
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb+srv://admin:admin@cluster0.kvkm1vk.mongodb.net/futbol_db?appName=Cluster0
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_PROFILES_ACTIVE: docker
      API_FOOTBALL_KEY: test

  backend-node:
    build: ./backend-node
    ports:
      - "3000:3000"

  frontend-ionic:
    build:
      context: .
      dockerfile: frontend-ionic/Dockerfile
    ports:
      - "8100:80"