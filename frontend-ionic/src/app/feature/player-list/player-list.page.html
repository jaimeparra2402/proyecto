<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/landing" ></ion-back-button>
    </ion-buttons>
    <ion-title>Listado Completo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="inset">
    <ion-item *ngFor="let player of players">
      <ion-avatar slot="start">
        <img [src]="player.image || 'assets/placeholder-player.png'" alt="Jugador" />
      </ion-avatar>
      <ion-label>
        <h2>{{ player.name }}</h2>
        <p>{{ player.team }} - {{ player.league }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
