<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Añadir Jugador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-content>
      <ion-item class="ion-margin-bottom">
        <ion-input label="Nombre del Jugador" labelPlacement="floating" type="text" [(ngModel)]="name"></ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input label="Equipo" labelPlacement="floating" type="text" [(ngModel)]="team"></ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input label="Liga" labelPlacement="floating" type="text" [(ngModel)]="league"></ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input label="URL de Imagen (Opcional)" labelPlacement="floating" type="text" [(ngModel)]="image"></ion-input>
      </ion-item>

      <div class="ion-text-center ion-margin-vertical">
        <ion-button color="secondary" (click)="takePicture()">
          Usar Cámara Dispositivo
        </ion-button>
      </div>

      <div *ngIf="image" class="ion-text-center ion-margin-bottom">
        <img [src]="image" style="max-height: 150px; border-radius: 8px;" />
      </div>

      <h4>Ubicación de Alta (Editable haciendo clic)</h4>
      <div id="mapId" style="width: 100%; height: 250px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ccc; z-index: 1;"></div>
      
      <p style="font-size: 0.85em; color: gray;"> Lat: {{ latitude }} | Lng: {{ longitude }}</p>

      <ion-button expand="block" color="success" class="ion-margin-top" (click)="savePlayer()">
        Guardar Jugador
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
