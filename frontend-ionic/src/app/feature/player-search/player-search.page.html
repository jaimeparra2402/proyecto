<app-header
  title="Buscar jugador"
  defaultHref="/landing">
</app-header>

<ion-content class="ion-padding">
  <ion-card class="search-card ion-no-margin ion-margin-bottom">
    <ion-card-content>
      <ion-searchbar
        placeholder="Nombre del jugador (mín. 3 letras)"
        [(ngModel)]="searchName"
        [debounce]="0"
        show-clear-button="focus"
      >
      </ion-searchbar>

      <ion-select
        placeholder="Liga (obligatorio)"
        [(ngModel)]="searchLeague"
        fill="outline"
        class="custom-select"
      >
        <ion-select-option *ngFor="let l of leagues" [value]="l.value">
          {{ l.label }}
        </ion-select-option>
      </ion-select>

      <ion-select
        placeholder="Temporada (obligatorio)"
        [(ngModel)]="searchSeason"
        fill="outline"
        class="custom-select"
      >
        <ion-select-option *ngFor="let s of seasons" [value]="s">
          {{ s }}/{{ +s + 1 }}
        </ion-select-option>
      </ion-select>

      <p *ngIf="!formValid" class="hint-text">
        <span *ngIf="searchName.length < 3">· Escribe al menos 3 letras</span>
        <span *ngIf="!searchLeague">· Selecciona una liga</span>
        <span *ngIf="!searchSeason">· Selecciona una temporada</span>
      </p>

      <ion-button
        expand="block"
        class="ion-margin-top"
        [disabled]="!formValid || loading"
        (click)="search()"
      >
        <ion-icon name="search-outline" slot="start"></ion-icon>
        {{ loading ? 'Buscando...' : 'Buscar' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <app-list
    *ngIf="!loading && players.length > 0"
    [items]="players"
    type="external"
    [isLoggedIn]="hasToken"
    (onImportPlayer)="savePlayerToLocal($event)"
  >
  </app-list>
  
  <div
    *ngIf="!loading && searched && players.length === 0"
    class="empty-state ion-text-center ion-padding"
  >
    <p>No se encontraron jugadores.</p>
  </div>
</ion-content>
