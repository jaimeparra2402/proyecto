<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Panel de Gestión - Fútbol</ion-title>
  </ion-toolbar>
  <app-api-toggle></app-api-toggle>
</ion-header>

<ion-content class="ion-padding">

  <div class="ion-margin-bottom">
    <h3 style="margin-left: 5px; font-size: 0.9rem; color: gray; text-transform: uppercase;">Funciones de Usuario</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
      
      <ion-button color="primary" (click)="goToImportApi()">
        Importar desde API Fútbol
      </ion-button>

      <ion-button color="success" (click)="goToAddPlayerForm()">
        Añadir por Formulario
      </ion-button>

      <ion-button color="tertiary" (click)="goToIdealTeam()">
        Equipo Ideal IA
      </ion-button>

      <ion-button color="medium" (click)="goToViewNews()">
        Ver Noticias CORBA
      </ion-button>
      
    </div>
  </div>

  <div class="ion-margin-bottom" *ngIf="authService.isUserAdmin()">
    <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;" />
    <h3 style="margin-left: 5px; font-size: 0.9rem; color: var(--ion-color-danger); text-transform: uppercase;">Panel de Administrador</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
      
      <ion-button color="danger" (click)="goToCreateNewsCorba()">
        Publicar Noticia CORBA
      </ion-button>

    </div>
  </div>

  <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;" />

  <div style="display: flex; justify-content: center; margin-bottom: 20px;">
    <ion-button color="dark" fill="outline" (click)="logout()">
      Cerrar Sesión
    </ion-button>
  </div>

  </ion-content>
