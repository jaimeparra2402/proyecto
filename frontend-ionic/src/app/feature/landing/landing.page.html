<app-header
  title="Bienvenidos"
  [showBackButton]="false"
  [forceLoggedOut]="true"> 
</app-header>

<ion-content>
  <div class="landing-container">

    <div class="hero-section">
      <h1 class="hero-title">Football<span class="hero-accent">Manager</span></h1>
      <p class="hero-subtitle">Gestiona y descubre jugadores de todo el mundo</p>
    </div>

    <div class="toggle-section">
      <p class="toggle-label">Backend activo</p>
      <app-api-toggle></app-api-toggle>
    </div>

    <button class="main-btn" (click)="goToList()">
      <span class="btn-text">
        <strong>Ver jugadores</strong>
        <small>Accede al listado completo</small>
      </span>
      <span class="btn-arrow">→</span>
    </button>

  </div>
</ion-content>
