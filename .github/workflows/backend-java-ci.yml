name: Backend Java CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'JPA/backend-java/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for GCP
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Docker Image
      run: |
        docker build -t gcr.io/cc-25-26/backend-java ./JPA/backend-java
        docker push gcr.io/cc-25-26/backend-java

    - name: Deploy to Cloud Run
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
      run: |
        gcloud run deploy backend-java \
          --image gcr.io/cc-25-26/backend-java \
          --platform managed \
          --region europe-west1 \
          --allow-unauthenticated \
          --set-env-vars "DB_URL=$DB_URL,DB_USER=$DB_USER,DB_PASS=$DB_PASS"