<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Listado Completo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-list
    [items]="players"
    type="players"
    [isAdmin]="authService.isSystemAdmin()"
    (onSelect)="goToDetail($event)"
    (edit)="onEditPlayer($event)"
    (delete)="onDeletePlayer($event)"
  >
  </app-list>
</ion-content>
