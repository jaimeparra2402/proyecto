name: Frontend Ionic CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**' 
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**'

  workflow_dispatch:

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: frontend-ionic
  REGION: europe-west1

jobs:
  test-and-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend-ionic/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend-ionic
        npm ci

    - name: Build + Run Cypress E2E Tests (Chrome & Electron)
      run: |
        # 1. Compilar la librería list primero
        cd list
        npm install
        npm run build

        # 2. Compilar el frontend
        cd ../frontend-ionic
        npm install
        npx ng build

        # 3. Start server + tests
        npx start-server-and-test \
          "npx ionic serve --port 8100 --no-open" \
          http://localhost:8100 \
          "npx cypress run --browser chrome && npx cypress run --browser electron"

    - name: Run Static Code Analysis (Linter)
      run: |
        cd frontend-ionic
        npm run lint || true

