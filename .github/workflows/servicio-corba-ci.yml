name: Servicio CORBA CI

on:
  push:
    branches: [ main ]
    paths:
      - 'servicio-corba/**' 
  pull_request:
    branches: [ main ]
    paths:
      - 'servicio-corba/**'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify CORBA directory structure
      run: |
        echo "Verifying CORBA files..."
        ls -la servicio-corba/