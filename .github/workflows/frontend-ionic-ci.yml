name: Frontend Ionic CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**' 
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**'

jobs:
  build-and-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend-ionic/package-lock.json'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: |
        cd frontend-ionic
        npm ci

    - name: Build Ionic App
      run: |
        cd frontend-ionic
        npm run build -- --configuration=production

    - name: Sync Capacitor Android
      run: |
        cd frontend-ionic
        npx cap sync android

    - name: Build Android APK
      run: |
        cd frontend-ionic/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: frontend-ionic/android/app/build/outputs/apk/debug/app-debug.apk