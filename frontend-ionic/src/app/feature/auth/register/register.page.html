<app-header
  title="Registro"
  defaultHref="/landing">
</app-header>

<ion-content class="ion-padding">
  <div class="auth-header">
    <h2>Crear cuenta</h2>
    <p>Únete y gestiona tus jugadores</p>
  </div>

  <ion-card class="auth-card">
    <ion-card-content>

      <ion-item [class.item-error]="emailTouched && !email">
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          [(ngModel)]="email"
          (ionBlur)="emailTouched = true"
          autocomplete="email"
        >
        </ion-input>
      </ion-item>
      <p class="field-error" *ngIf="emailTouched && !email">
        El correo es obligatorio
      </p>

      <ion-item
        class="ion-margin-top"
        [class.item-error]="passwordTouched && password.length < 6"
      >
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          (ionBlur)="passwordTouched = true"
          autocomplete="new-password"
        >
        </ion-input>
        <ion-button
          slot="end"
          fill="clear"
          (click)="showPassword = !showPassword"
          tabindex="-1"
        >
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-item>
      <p class="field-error" *ngIf="passwordTouched && password.length < 6">
        La contraseña debe tener al menos 6 caracteres
      </p>

      <div class="error-message" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMessage }}
      </div>

      <ion-button
        expand="block"
        class="ion-margin-top main-btn"
        [disabled]="loading"
        (click)="onRegister()"
      >
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ loading ? 'Creando cuenta...' : 'Crear Cuenta' }}
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        class="secondary-btn"
        (click)="goToLogin()"
      >
        ¿Ya tienes cuenta? Inicia sesión aquí
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
