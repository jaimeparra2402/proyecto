<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/landing"></ion-back-button>
    </ion-buttons>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="auth-header">
    <h2>Bienvenido de nuevo</h2>
    <p>Inicia sesión para continuar</p>
  </div>

  <ion-card class="auth-card">
    <ion-card-content>

      <ion-item [class.item-error]="emailTouched && !email">
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          [(ngModel)]="email"
          (ionBlur)="emailTouched = true"
          autocomplete="email"
          data-testid="login-email">
        </ion-input>
      </ion-item>
      <p class="field-error" *ngIf="emailTouched && !email">El correo es obligatorio</p>

      <ion-item class="ion-margin-top" [class.item-error]="passwordTouched && !password">
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          (ionBlur)="passwordTouched = true"
          autocomplete="current-password"
          data-testid="login-password">
        </ion-input>
        <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" tabindex="-1">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
      <p class="field-error" *ngIf="passwordTouched && !password">La contraseña es obligatoria</p>

      <div class="error-message" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMessage }}
      </div>

      <ion-button
        expand="block"
        class="ion-margin-top main-btn"
        [disabled]="loading"
        (click)="onLogin()"
        data-testid="login-btn">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ loading ? 'Entrando...' : 'Ingresar' }}
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        class="secondary-btn"
        (click)="goToRegister()">
        ¿No tienes cuenta? Regístrate aquí
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
