<div class="list-wrap">
  <ion-item
    *ngFor="let item of items"
    lines="none"
    class="player-item"
    button="true"
    (click)="selectItem(item)"
  >
    <ng-container *ngIf="type === 'players' || type === 'external'">
      <player-row-item
        [name]="item.name"
        [team]="item.team"
        [league]="item.league"
        [position]="item.position"
        [imageUrl]="item.imageUrl || item.photo"
        [type]="type"
        [isAdmin]="isAdmin"
        [isLoggedIn]="isLoggedIn"
        (editClick)="editItem(item)"
        (deleteClick)="deleteItem(item)"
        (importClick)="importSinglePlayer(item)"
        style="width: 100%;"
      ></player-row-item>
    </ng-container>

    <ng-container *ngIf="type === 'comments'">
      <ion-icon name="chatbubble-ellipses-outline" slot="start" color="primary" />
      <ion-label class="ion-text-wrap">
        <h3>{{ item.username || 'Usuario anónimo' }}</h3>
        <p class="comment-text">"{{ item.text }}"</p>
        <div class="stars" *ngIf="item.rating">
          <ion-icon
            name="star"
            color="warning"
            *ngFor="let s of getStars(item.rating)"
          />
        </div>
      </ion-label>
    </ng-container>
  </ion-item>
</div>

<div *ngIf="!items?.length" class="empty-state">
  <ion-icon name="folder-open-outline"></ion-icon>
  <p>No hay elementos disponibles.</p>
</div>
