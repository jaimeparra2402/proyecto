<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/landing"></ion-back-button>
    </ion-buttons>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item class="ion-margin-bottom">
    <ion-input 
      label="Correo" 
      labelPlacement="floating" 
      type="email" 
      [(ngModel)]="email"
      data-testid="login-email">
    </ion-input>
  </ion-item>

  <ion-item class="ion-margin-bottom">
    <ion-input 
      label="Contraseña" 
      labelPlacement="floating" 
      type="password" 
      [(ngModel)]="password"
      data-testid="login-password">
    </ion-input>
  </ion-item>

  <p *ngIf="errorMessage" style="color: var(--ion-color-danger); margin-left: 10px;">
    {{ errorMessage }}
  </p>
  <ion-button expand="block" fill="clear" (click)="goToRegister()" class="ion-margin-top">
    ¿No tienes cuenta? Regístrate aquí
  </ion-button>
  
  <ion-button expand="block" (click)="onLogin()" class="ion-margin-top" data-testid="login-btn">
    Ingresar
  </ion-button>

</ion-content>
