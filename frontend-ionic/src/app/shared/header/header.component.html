<ion-header class="custom-header">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="showBackButton">
      <ion-back-button [defaultHref]="defaultHref" class="back-btn"></ion-back-button>
    </ion-buttons>

    <ion-title class="header-title">{{ title }}</ion-title>

    <ion-buttons slot="end">
      <ng-container *ngIf="currentUser; else notLogged">
        <ion-button fill="clear" disabled class="user-info-btn">
          <ion-icon
            [name]="isAdmin ? 'shield-checkmark-outline' : 'person-outline'"
            slot="start">
          </ion-icon>
          <ion-label>{{ userDisplayName }}</ion-label>
        </ion-button>

        <ion-button fill="clear" (click)="confirmLogout()" class="logout-btn">
          <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ng-container>

      <ng-template #notLogged>
        <ion-button fill="clear" (click)="goToLogin()" class="login-btn">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Iniciar sesión</ion-label>
        </ion-button>
      </ng-template>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
