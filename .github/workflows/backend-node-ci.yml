name: Backend Node.js CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-node/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-node/**'
  workflow_dispatch:

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: backend-node
  REGION: europe-west1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # --- CONEXIÓN A BASE DE DATOS PARA TESTS (RÚBRICA) ---
    # Levantamos un contenedor temporal de MongoDB dentro del pipeline
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend-node/package-lock.json'

    - name: Install dependencies
      run: |
        cd backend-node
        npm ci

    - name: Run Code Linting (Análisis Estático)
      run: |
        cd backend-node
        npx eslint . --ext .js || true 

    - name: Run Unit Tests with Coverage (Métricas de Calidad)
      run: |
        cd backend-node
        npm test -- --coverage || npm test
      env:
        MONGO_URI: mongodb://localhost:27017/futbol_db
        NODE_ENV: test
        JWT_SECRET: tu_clave_secreta_del_env # Clave simétrica para firmar el bypass del test
        GEMINI_API_KEY: AIzaSyFakeKey_ForTestsOnly # Mock key para que el SDK de Google AI no falle al inicializarse

    - name: Verify code structure
      run: |
        cd backend-node
        node --check server.js

