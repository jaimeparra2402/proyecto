name: Frontend Ionic CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**' 
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-ionic/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend-ionic/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend-ionic
        npm ci

    - name: Build Ionic App
      run: |
        cd frontend-ionic
        # Ejecuta la compilación de producción de Angular/Ionic
        npm run build -- --configuration=production