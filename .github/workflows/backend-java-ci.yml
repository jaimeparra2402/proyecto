name: Backend Java CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'JPA/backend-java/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'JPA/backend-java/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: 'false'
        type: boolean
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [ production, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: backend-java
  REGION: europe-west1
  ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev
  REPO_NAME: futbol-repo
  JAVA_VERSION: '17'
  IMAGE: europe-west1-docker.pkg.dev/cc-25-26/futbol-repo/backend-java

defaults:
  run:
    working-directory: JPA/backend-java

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      jar-name: ${{ steps.build.outputs.jar-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'JPA/backend-java/pom.xml'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('JPA/backend-java/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Install dependencies (offline)
        run: mvn dependency:go-offline -q

      - name: Run Checkstyle (linting)
        run: mvn checkstyle:check
        continue-on-error: true   

      - name: Run unit tests + coverage
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: mvn test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/futbol_db
          SPRING_PROFILES_ACTIVE: test
          EUREKA_CLIENT_ENABLED: "false"
          SPRING_CLOUD_CONFIG_ENABLED: "false"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPRING_AI_GOOGLE_AI_API_KEY: ${{ secrets.SPRING_AI_GOOGLE_AI_API_KEY }}

      - name: Upload coverage report (JaCoCo)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: JPA/backend-java/target/site/jacoco/
          retention-days: 7

      - name: Build JAR
        id: build
        run: |
          mvn clean package -DskipTests -B
          JAR=$(ls target/*.jar | head -1 | xargs basename)
          echo "jar-name=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: JPA/backend-java/target/*.jar
          retention-days: 1

  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: JPA/backend-java/target/

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          echo "image-tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Image tag: $SHORT_SHA"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.image-tag }} \
            -t ${{ env.IMAGE }}:latest \
            JPA/backend-java/.

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.image-tag }}
          docker push ${{ env.IMAGE }}:latest

  deploy-to-gcp:
    name: Deploy to Cloud Run
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get current revision (for rollback)
        id: current-revision
        run: |
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "")
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Current revision: $REVISION"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ needs.docker-build-push.outputs.image-tag }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --port 8081 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars "\
              SPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }},\
              SPRING_PROFILES_ACTIVE=production,\
              API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }},\
              SPRING_AI_GOOGLE_AI_API_KEY=${{ secrets.SPRING_AI_GOOGLE_AI_API_KEY }},\
              EUREKA_CLIENT_ENABLED=false,\
              SPRING_CLOUD_CONFIG_ENABLED=false\
            " \
            --format='value(status.url)' | tee /tmp/service-url.txt

          echo "url=$(cat /tmp/service-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Health check
        id: health
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Health check en $SERVICE_URL/actuator/health"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/actuator/health" || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 10
          done
          echo " Health check fallido"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.current-revision.outputs.revision != ''
        run: |
          echo "Deploy fallido. Haciendo rollback a ${{ steps.current-revision.outputs.revision }}..."
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --to-revisions ${{ steps.current-revision.outputs.revision }}=100
          echo " Rollback completado"

      - name: Print deployed URL
        if: success()
        run: echo "🚀 Desplegado en ${{ steps.deploy.outputs.url }}"


  notify:
    name: Notify result
    needs: [ build-and-test, docker-build-push, deploy-to-gcp ]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline summary
        run: |
          echo "## Pipeline summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | ${{ needs.docker-build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Cloud Run | ${{ needs.deploy-to-gcp.result }} |" >> $GITHUB_STEP_SUMMARY