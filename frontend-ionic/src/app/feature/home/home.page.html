<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Panel de Gestión - Fútbol</ion-title>
  </ion-toolbar>
  <app-api-toggle></app-api-toggle>
</ion-header>

<ion-content class="ion-padding">
  <div class="user-greeting">
    <h2>¡Hola, {{ getUsername() }}!</h2>
    <p>Conectado como: {{ authService.currentUser()?.email }}</p>
  </div>

  <div class="ion-margin-bottom">
    <h3 class="section-title">Funciones de Usuario</h3>
    <div class="button-grid">
      <ion-button color="primary" (click)="goToImportApi()">
        Importar desde API Fútbol
      </ion-button>

      <ion-button color="success" (click)="goToAddPlayerForm()">
        Añadir por Formulario
      </ion-button>

      <ion-button color="tertiary" (click)="goToIdealTeam()">
        Equipo Ideal IA
      </ion-button>

      <div *ngIf="authService.isSystemAdmin()">
          <ion-button color="danger" (click)="goToViewNews()">
            Publicar Noticia CORBA
          </ion-button>
      </div>

      <ion-button color="secondary" (click)="goToPlayerList()">
        Ver Todos los Jugadores
      </ion-button>

      <ion-button color="warning" (click)="goToSearchPlayers()">
        Buscar Jugadores
      </ion-button>
    </div>
  </div>

  <hr class="section-divider" />

  <div class="logout-container">
    <ion-button color="dark" fill="outline" (click)="logout()">
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
