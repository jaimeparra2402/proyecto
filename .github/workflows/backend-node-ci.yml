name: Backend Node.js CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-node/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-node/**'
  workflow_dispatch:

env:
  PROJECT_ID: cc-25-26
  SERVICE_NAME: backend-node
  REGION: europe-west1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # --- CONEXIÓN A BASE DE DATOS PARA TESTS (RÚBRICA) ---
    # Levantamos un contenedor temporal de MongoDB dentro del pipeline
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend-node/package-lock.json'

    - name: Install dependencies
      run: |
        cd backend-node
        npm ci

    - name: Run Code Linting (Análisis Estático)
      run: |
        cd backend-node
        npx eslint . --ext .js || true 


    - name: Run Unit Tests with Coverage (Métricas)
      run: |
        cd backend-node
        npm test
      env:
        MONGO_URI: mongodb://localhost:27017/futbol_db
        NODE_ENV: test

    - name: Verify code structure
      run: |
        cd backend-node
        node --check server.js

  deploy-to-gcp:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Container
      run: |
        cd backend-node
        docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA .
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA

    - name: Build and Push Docker Image
      run: |
        cd backend-node
        docker build -t europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA .
        gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
        docker push europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image europe-west1-docker.pkg.dev/$PROJECT_ID/futbol-repo/$SERVICE_NAME:$GITHUB_SHA \
          --platform managed \
          --region europe-west1 \
          --port 8080 \
          --set-env-vars MONGO_URI="mongodb+srv://admin:admin@cluster0.kvkm1vk.mongodb.net/futbol_db?appName=Cluster0",NODE_ENV="production" \
          --timeout 300