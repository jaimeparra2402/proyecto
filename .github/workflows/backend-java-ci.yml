name: Backend Java CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-java/**' 
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-java/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: |
        cd backend-java
        chmod +x mvnw
        ./mvnw clean compile